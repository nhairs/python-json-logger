name: Benchmark JSON formatters

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: CPython ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Install benchmark dependencies
        run: uv sync --python '${{ matrix.python }}' --no-default-groups --group benchmark
      - name: Measure formatters
        run: |
          mkdir -p benchmark-results
          uv run --no-sync pytest benchmarks --benchmark-warmup=on --benchmark-json=benchmark-results/python-${{ matrix.python }}.json
      - name: Summarize measurements
        run: uv run --no-sync python scripts/benchmark_report.py benchmark-results/*.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-python-${{ matrix.python }}
          path: benchmark-results/*.json
          if-no-files-found: error

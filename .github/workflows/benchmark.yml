name: Benchmark JSON formatters

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_PYTHON_PREFERENCE: managed

jobs:
  benchmark:
    name: Benchmark supported Python runtimes
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Read supported Python runtimes from tox
        run: |
          uvx --with tox-uv tox list -d --no-desc > /tmp/tox-environments
          python - <<'PYTHON' >> "$GITHUB_ENV"
          import re
          from pathlib import Path
          environments = [
              name + '-benchmark'
              for name in Path('/tmp/tox-environments').read_text().splitlines()
              if re.fullmatch(r'(?:py|pypy)[0-9]+', name)
          ]
          assert environments, 'No Python environments found in tox'
          print('BENCHMARK_ENVIRONMENTS=' + ','.join(environments))
          PYTHON
      - name: Measure formatters sequentially with tox
        run: uvx --with tox-uv tox -e "$BENCHMARK_ENVIRONMENTS"
      - name: Collect and summarize measurements
        if: always()
        run: |
          python - <<'PYTHON'
          from pathlib import Path
          import shutil
          target = Path('benchmark-results')
          target.mkdir(exist_ok=True)
          for source in Path('.tox').glob('*-benchmark/tmp/benchmark.json'):
              shutil.copyfile(source, target / (source.parents[1].name + '.json'))
          PYTHON
          python scripts/benchmark_report.py benchmark-results/*.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: benchmark-results/*.json
          if-no-files-found: error

name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'nhairs/python-json-logger'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install packaging
      - run: python scripts/release.py prepare
  ci:
    needs: validate
    uses: ./.github/workflows/test-suite.yml
  build:
    permissions:
      contents: read
      actions: read
    needs: [validate, ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install build packaging twine
      - name: Recover retained artifacts before considering a build
        id: recover
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" > artifacts.json
          python - <<'PY'
          import json, os, subprocess
          artifacts = [a for a in json.load(open('artifacts.json'))['artifacts'] if a['name'] == 'release-bundle']
          if len(artifacts) > 1 or any(a['expired'] for a in artifacts):
              raise SystemExit('Ambiguous or expired bundle; recover manually')
          if artifacts:
              subprocess.run(['gh', 'run', 'download', os.environ['GITHUB_RUN_ID'], '-n', 'release-bundle', '-D', 'bundle'], check=True)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'recovered={str(bool(artifacts)).lower()}\n')
          PY
      - name: Refuse to rebuild an existing release
        if: steps.recover.outputs.recovered != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/release.py prepare
          python - <<'PY'
          import json, os, sys, urllib.error, urllib.request
          sys.path.insert(0, 'scripts')
          from release import GitHub
          info = json.load(open('bundle/release.json'))
          api = GitHub()
          # A read-only token cannot reliably see drafts. Refuse fresh runs of
          # a previously attempted tag; recovery belongs to the original run.
          page = 1
          while True:
              runs = api.request('/actions/workflows/release.yml/runs?event=push&per_page=100&page=' + str(page))['workflow_runs']
              if any(str(r['id']) != os.environ['GITHUB_RUN_ID'] and r['head_branch'] == info['tag'] for r in runs):
                  raise SystemExit('Previous run for this tag: rerun the original run or recover manually')
              if len(runs) < 100:
                  break
              page += 1
          page = 1
          while True:
              jobs = api.request('/actions/runs/' + os.environ['GITHUB_RUN_ID'] + '/jobs?filter=all&per_page=100&page=' + str(page))['jobs']
              if any((j['name'] == 'build' and j['conclusion'] == 'success') or (j['name'] == 'draft' and j['started_at'] is not None and j['conclusion'] != 'skipped') for j in jobs):
                  raise SystemExit('Previous bundle unavailable after build/staging: recover manually')
              if len(jobs) < 100:
                  break
              page += 1
          if api.request('/releases/tags/' + info['tag']) is not None:
              raise SystemExit('Existing GitHub release: restore retained artifacts manually')
          try:
              urllib.request.urlopen('https://pypi.org/pypi/python-json-logger/' + info['version'] + '/json')
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
          else:
              raise SystemExit('Existing PyPI release: restore retained artifacts manually')
          PY
      - if: steps.recover.outputs.recovered != 'true'
        run: |
          python -m build --outdir bundle/dist
          python scripts/release.py validate
          python -m twine check bundle/dist/*
          python -m venv "$RUNNER_TEMP/release-install"
          "$RUNNER_TEMP/release-install/bin/python" -m pip install --no-deps bundle/dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/release-install/bin/python" -I -c 'from pythonjsonlogger.json import JsonFormatter; import logging; assert JsonFormatter().format(logging.LogRecord("release", 20, "", 0, "smoke", (), None)) == "{\"message\": \"smoke\"}"'
      - name: Verify bundle identity and checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          bundle = pathlib.Path('bundle')
          info = json.loads((bundle / 'release.json').read_text())
          assert info['tag'] == os.environ['RELEASE_TAG']
          assert info['commit'] == subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          manifest = json.loads((bundle / 'SHA256SUMS.json').read_text())
          assert len(manifest) == 2
          assert set(manifest) == {p.name for p in (bundle / 'dist').iterdir()}
          for name, digest in manifest.items():
              assert pathlib.Path(name).name == name
              assert hashlib.sha256((bundle / 'dist' / name).read_bytes()).hexdigest() == digest
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.recover.outputs.recovered != 'true'
        with:
          name: release-bundle
          path: bundle/
          if-no-files-found: error
          retention-days: 90
  draft:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install packaging
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-bundle
          path: bundle
      - run: python scripts/release.py stage
        env:
          GH_TOKEN: ${{ github.token }}
  publish:
    needs: draft
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/python-json-logger
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-bundle
          path: bundle
      # Deliberately inline: this job never checks out or executes repository code.
      - name: Verify retained bytes and select missing PyPI files
        id: files
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, shutil, urllib.error, urllib.request
          bundle = pathlib.Path('bundle')
          info = json.loads((bundle / 'release.json').read_text())
          assert info['tag'] == os.environ['RELEASE_TAG']
          assert info['commit'] == os.environ['RELEASE_COMMIT']
          manifest = json.loads((bundle / 'SHA256SUMS.json').read_text())
          assert len(manifest) == 2
          assert set(manifest) == {p.name for p in (bundle / 'dist').iterdir()}
          assert sum(n.endswith('.whl') for n in manifest) == 1
          assert sum(n.endswith('.tar.gz') for n in manifest) == 1
          for name, digest in manifest.items():
              assert pathlib.Path(name).name == name
              assert hashlib.sha256((bundle / 'dist' / name).read_bytes()).hexdigest() == digest
          try:
              with urllib.request.urlopen('https://pypi.org/pypi/python-json-logger/' + info['version'] + '/json') as response:
                  existing = {item['filename']: item['digests']['sha256'] for item in json.load(response)['urls']}
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              existing = {}
          if any(name not in manifest or manifest[name] != digest for name, digest in existing.items()):
              raise SystemExit('PyPI files conflict with retained manifest')
          missing = set(manifest) - set(existing)
          pathlib.Path('upload').mkdir()
          for name in missing:
              shutil.copyfile(bundle / 'dist' / name, pathlib.Path('upload') / name)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'missing={str(bool(missing)).lower()}\n')
          PY
      - uses: pypa/gh-action-pypi-publish@106e0b0b7c337fa67ed433972f777c6357f78598 # v1.13.0
        if: steps.files.outputs.missing == 'true'
        with:
          packages-dir: upload/

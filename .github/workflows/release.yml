# Keep the nopt version and action commit pins consistent across all jobs.
name: Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preflight:
    if: github.repository == 'nhairs/python-json-logger'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
      - run: uvx --from 'nopt==0.2.0' nopt ci-preflight
        env:
          GH_TOKEN: ${{ github.token }}
  ci:
    needs: preflight
    uses: ./.github/workflows/test-suite.yml
  build:
    needs: [preflight, ci]
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.bundle.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
      - id: build
        run: uvx --from 'nopt==0.2.0' nopt build --output "$RUNNER_TEMP/release-bundle"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Check the installed wheel
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/release-install"
          uv pip install --python "$RUNNER_TEMP/release-install/bin/python" --no-deps "$RUNNER_TEMP"/release-bundle/dist/*.whl
          "$RUNNER_TEMP/release-install/bin/python" -I scripts/release_smoke.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: bundle
        with:
          name: release-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-bundle/
          retention-days: 90
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/python-json-logger
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/release-bundle
      - run: uvx --from 'nopt==0.2.0' nopt publish-release-preflight --bundle "$RUNNER_TEMP/release-bundle"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: ${{ runner.temp }}/release-bundle/dist/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: publication-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-bundle/dist/
          retention-days: 90
          if-no-files-found: warn
  github-release:
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/release-bundle
      - run: uvx --from 'nopt==0.2.0' nopt publish-github-release --bundle "$RUNNER_TEMP/release-bundle"
        env:
          GH_TOKEN: ${{ github.token }}

name: Release
on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'nhairs/python-json-logger'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install packaging
      - run: python scripts/release.py prepare
  ci:
    needs: validate
    uses: ./.github/workflows/test-suite.yml
  build:
    permissions:
      contents: read
      actions: read
    needs: [validate, ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install build packaging twine
      - name: Recover retained artifacts before considering a build
        id: recover
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release.py recover
      - name: Refuse to rebuild an existing release
        if: steps.recover.outputs.recovered != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/release.py prepare
          python scripts/release.py guard
      - if: steps.recover.outputs.recovered != 'true'
        run: |
          python -m build --outdir bundle/dist
          python scripts/release.py validate
          python -m twine check bundle/dist/*
          python -m venv "$RUNNER_TEMP/release-install"
          "$RUNNER_TEMP/release-install/bin/python" -m pip install --no-deps bundle/dist/*.whl
          "$RUNNER_TEMP/release-install/bin/python" -I scripts/release_smoke.py
      - name: Verify bundle identity and checksums
        run: python scripts/release.py verify
      # Re-retain official release recovery for downstream jobs. An available
      # original artifact is never replaced; overwrite only clears expired entries.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.recover.outputs.retained != 'true'
        with:
          name: release-bundle
          overwrite: true
          path: bundle/
          if-no-files-found: error
          retention-days: 90
  draft:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install packaging
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-bundle
          path: bundle
      - run: python scripts/release.py stage
        env:
          GH_TOKEN: ${{ github.token }}
  select:
    needs: draft
    runs-on: ubuntu-latest
    outputs:
      missing: ${{ steps.files.outputs.missing }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install packaging
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-bundle
          path: bundle
      - name: Verify retained bytes and select missing PyPI files
        id: files
        run: python scripts/release.py select
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.files.outputs.missing == 'true'
        with:
          name: pypi-upload-${{ github.run_attempt }}
          path: upload/
          if-no-files-found: error
          retention-days: 90
  publish:
    needs: select
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/python-json-logger
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.select.outputs.missing == 'true'
        with:
          name: pypi-upload-${{ github.run_attempt }}
          path: upload
      - name: Publish the verified GitHub release before uploading to PyPI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          is_draft=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
          if [ "$is_draft" = true ]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"
          fi
      - uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        if: needs.select.outputs.missing == 'true'
        with:
          packages-dir: upload/

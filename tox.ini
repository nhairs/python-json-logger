[tox]
requires = tox>=3,tox-uv
envlist = py{310,311,312,313,314,315}, pypy{310,311,312}

[testenv]
description = run unit tests
dependency_groups = dev
commands =
    pytest tests {posargs}

[testenv:format]
description = run formatters
dependency_groups = dev
commands =
    black src tests benchmarks scripts/benchmark_report.py

[testenv:lint]
description = run linters
dependency_groups = dev
commands =
    validate-pyproject pyproject.toml
    black --check --diff src tests benchmarks scripts/benchmark_report.py
    pylint src
    pyrefly check src tests

[testenv:benchmark]
description = compare JSON formatter performance
dependency_groups = benchmark
commands =
    pytest benchmarks --benchmark-warmup=on --benchmark-json={envtmpdir}/benchmark.json {posargs}

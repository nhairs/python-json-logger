[tox]
requires = tox>=4,tox-uv
cpython_versions = 310,311,312,313,314,315
pypy_versions = 310,311,312
envlist = py{{[tox]cpython_versions}}, pypy{{[tox]pypy_versions}}
labels =
    benchmark = py{{[tox]cpython_versions}}-benchmark, pypy{{[tox]pypy_versions}}-benchmark

[testenv]
description =
    !benchmark: run unit tests
    benchmark: compare JSON formatter performance
dependency_groups =
    !benchmark: dev
    benchmark: benchmark
pass_env =
    benchmark: GITHUB_RUN_ID
    benchmark: GITHUB_RUN_ATTEMPT
commands =
    !benchmark: pytest tests {posargs}
    benchmark: pytest benchmarks --benchmark-warmup=on --benchmark-json={envtmpdir}/benchmark.json {posargs}

[testenv:format]
description = run formatters
dependency_groups = dev
commands =
    black src tests benchmarks scripts/benchmark_report.py scripts/benchmark_plots.py

[testenv:lint]
description = run linters
dependency_groups = dev
commands =
    validate-pyproject pyproject.toml
    black --check --diff src tests benchmarks scripts/benchmark_report.py scripts/benchmark_plots.py
    pylint src
    pyrefly check src tests
